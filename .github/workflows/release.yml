name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.release.outputs.body }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}


  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: windows-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Attest artifacts
        uses: actions/attest@v4
        with:
          subject-path: "./target/i686-pc-windows-msvc/release/fallback.dll"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          NOTES: ${{ needs.release-please.outputs.body }}
        run: |
          gh release create "$TAG" "./target/i686-pc-windows-msvc/release/fallback.dll" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes "$NOTES"
