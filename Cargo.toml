[package]
name = "fallback"
version = "0.3.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
arboard = "3"
arc-swap = "1"
base64 = "0.23"
bitflags = "2"
constcat = "0.6"
dirs = "7"
hudhook = { version = "0.9", features = ["dx9", "imgui-tables-api"] }
ilhook = { version = "2.3", default-features = false, features = ["x86"] }
include_dir = "0.7"
indoc = "2"
inventory = "0.3"
log = "0.4"
macro_rules_attribute = "0.2"
mlua = { version = "0.12", features = ["async", "lua54", "send", "vendored"] }
notify = "9"
notify-debouncer-mini = "0.8"
rayon = "1"
scopeguard = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
simplelog = "0.12"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tree-sitter = "0.27"
tree-sitter-lua = "0.5"
uuid = { version = "1", features = ["v4"] }
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D9",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[lints.clippy]
missing_transmute_annotations = "allow"
